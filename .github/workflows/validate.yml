name: Validate Python
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: python-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test-linux-cpu.lock.txt
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0+cpu
      - run: python -m pip install -r requirements-test-linux-cpu.lock.txt -r requirements-dev.txt -r requirements-ml.txt
      - run: python -m pip check
      - run: python -m pytest -q
