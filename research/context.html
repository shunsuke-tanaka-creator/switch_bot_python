<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>拠点とタスクの記録</title>
<style>
body{font:16px system-ui,sans-serif;background:#f3f6f4;color:#20382e;margin:0}main{max-width:960px;margin:auto;padding:24px}section{background:white;border:1px solid #d7e1db;border-radius:14px;padding:20px;margin:18px 0}h1{font-size:26px}h2{font-size:20px}label{display:block;margin:12px 0}input,select,button{font:inherit;padding:10px;border:1px solid #a7bdb1;border-radius:6px;max-width:100%;box-sizing:border-box}button{cursor:pointer;background:#e7f3ed;margin:5px 4px 5px 0}button:disabled{opacity:.5}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid #dce6df;padding:10px;text-align:left}.scroll{overflow:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.card{background:#f0f6f2;padding:16px;border-radius:8px}.value{font-size:22px}.muted{color:#566d60;font-size:14px}#status{white-space:pre-line;color:#345f48}a{color:#24694d}details{padding:12px 0}summary{cursor:pointer}#error{color:#a32626}
</style><main>
<a href="/research/__PARTICIPANT__/insights">生活の気づきへ</a><h1>拠点とタスクの記録</h1>
<p>いつもの拠点と、そこでしているタスクを別々に記録します。GPSは使用しません。</p>
<p id="error" role="alert"></p><p id="status" role="status"></p>
<section><h2>現在の暫定推定</h2><div class="grid"><div class="card">拠点<div id="place" class="value">不明</div></div><div class="card">タスク<div id="task" class="value">不明</div></div></div>
<p id="training" class="muted"></p><button id="refresh">更新</button><p class="muted">候補は未確認です。タスクが変わっただけで拠点が変わったとは判断しません。</p></section>
<section><h2>確認・履歴の訂正</h2><p>拠点とタスクをそれぞれ選んで記録できます。別のまとまりに分ける場合は、対象の時間を指定して「新しく作る」を選びます。</p>
<form id="annotation"><div class="grid"><label>対象<select id="axis"><option value="place">拠点</option><option value="task">タスク</option></select></label><label>まとまり<select id="identity"></select></label></div>
<div class="grid"><label>開始<input id="start" type="datetime-local" required></label><label>終了<input id="end" type="datetime-local" required></label></div>
<label>名前（任意）<input id="name" maxlength="80" placeholder="例：自宅、研究室／仕事、休憩"></label><button>この時間の記録を保存</button></form>
<details><summary>名前の変更・まとまりの統合</summary><p>上で対象とまとまりを選んでください。統合しても元の記録は残ります。</p><button id="rename">名前だけ保存</button>
<label>統合先<select id="mergeTarget"></select></label><button id="merge">選択中のまとまりを統合先へまとめる</button></details></section>
<section><h2>その場の推定履歴</h2><div class="scroll"><table id="history"></table></div></section>
<section><h2>1日の振り返り</h2><p>その日の後に得た情報も使って再解釈します。当時の推定履歴は書き換えません。</p><label>日付（日本時間）<input id="day" type="date"></label><button id="review">振り返りを作成・更新</button><p id="reviewStatus"></p><div class="scroll"><table id="reviewRows"></table></div></section>
</main><script>
const p='__PARTICIPANT__',api='/api/research/'+p,$=id=>document.getElementById(id);let snapshot=null,busy=false;
const uid=()=>crypto.randomUUID?crypto.randomUUID():Array.from(crypto.getRandomValues(new Uint32Array(4))).join('-');
async function request(path,body){const r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});if(!r.ok){let text=await r.text();throw Error('保存・通信エラー '+r.status+' '+text.slice(0,200))}return r.json()}
async function emit(kind,payload){return request(api+'/events',{schema_version:'research-v2',event_id:uid(),participant_id:p,occurred_at:new Date().toISOString(),kind,payload})}
function localInput(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}
function label(axis,id){const n=snapshot?.nodes?.[axis]?.find(x=>x.id===id);return n?.name||((axis==='place'?'拠点 ':'タスク ')+(id?.slice(-5)||'不明'))}
function describe(axis,value){if(!value)return '不明';if(value.status==='moving')return '移動中（本人回答）';if(value.status==='unknown')return '不明（本人回答）';const id=value.id||value.candidate_id;if(!id)return '不明';return label(axis,id)+(value.status==='confirmed'?'（本人確認）':value.status==='estimated'?'（推定）':'（未確認の候補）')}
function table(id,items){const t=$(id);t.replaceChildren();const add=(values,header=false)=>{const tr=document.createElement('tr');for(const v of values){const td=document.createElement(header?'th':'td');td.textContent=v;tr.append(td)}t.append(tr)};add(['時刻','拠点','タスク'],true);for(const item of items)add([new Date(item.at).toLocaleString('ja-JP'),describe('place',item.place),describe('task',item.task)]);if(!items.length)add(['記録がありません','',''])}
function populate(){const a=$('axis').value,old=$('identity').value;for(const id of ['identity','mergeTarget']){const s=$(id);s.replaceChildren();for(const n of snapshot?.nodes?.[a]||[]){const o=document.createElement('option');o.value=n.id;o.textContent=label(a,n.id)+(n.confirmed?'':'（候補）');s.append(o)}}for(const [value,text] of [['new','新しく作る'],['unknown','わからない'],...(a==='place'?[['moving','移動中']]:[])]){const o=document.createElement('option');o.value=value;o.textContent=text;$('identity').append(o)}if([...$('identity').options].some(o=>o.value===old))$('identity').value=old;else $('identity').value='new'}
async function refresh(){snapshot=await request(api+'/context');for(const a of ['place','task'])$(a).textContent=describe(a,snapshot.current[a]);const t=snapshot.training;const states={untrained:'学習前',insufficient_observations:'観測データの蓄積待ち',insufficient_split:'比較用の日数・観測が不足',trained:'学習済み（未確認の候補は本人確認で育てます）'};$('training').textContent=(states[t.status]||t.status)+' ／ '+(t.days||0)+'日分。週の傾向は複数週の蓄積が必要です。';populate();table('history',snapshot.history.slice(-48));showReview()}
function showReview(){const r=snapshot?.reviews?.find(x=>x.day===$('day').value);table('reviewRows',r?.episodes||[]);$('reviewStatus').textContent=r?'更新：'+new Date(r.created_at).toLocaleString('ja-JP'):''}
async function run(fn){if(busy)return;busy=true;$('error').textContent='';document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await fn()}catch(e){$('error').textContent=e.message}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
$('annotation').onsubmit=e=>{e.preventDefault();run(async()=>{const axis=$('axis').value;let id=$('identity').value;if(id==='new')id=axis+'_'+uid();await emit('context_label',{axis,class_id:id,start:new Date($('start').value).toISOString(),end:new Date($('end').value).toISOString()});if($('name').value.trim()&&!['unknown','moving'].includes(id))await emit('context_name',{axis,class_id:id,name:$('name').value.trim()});$('status').textContent='保存しました。学習時に反映します。';await refresh()})};
$('rename').onclick=()=>run(async()=>{const id=$('identity').value;if(['new','unknown','moving'].includes(id))throw Error('名前を付ける既存のまとまりを選んでください');await emit('context_name',{axis:$('axis').value,class_id:id,name:$('name').value.trim()});$('status').textContent='名前を保存しました';await refresh()});
$('merge').onclick=()=>run(async()=>{const source=$('identity').value,target=$('mergeTarget').value;if(!target||['new','unknown','moving'].includes(source)||source===target)throw Error('異なる2つのまとまりを選んでください');if(!confirm(label($('axis').value,source)+' を '+label($('axis').value,target)+' に統合しますか？'))return;await emit('context_merge',{axis:$('axis').value,source_id:source,target_id:target});$('status').textContent='統合しました。再学習後に推定へ反映します。';await refresh()});
$('review').onclick=()=>run(async()=>{ $('reviewStatus').textContent='作成中…';await request(api+'/context/review/'+$('day').value,{});await refresh()});$('refresh').onclick=()=>run(refresh);$('axis').onchange=populate;$('day').onchange=showReview;
$('end').value=localInput(new Date());$('start').value=localInput(new Date(Date.now()-30*60000));$('day').value=new Date(Date.now()+9*3600000-86400000).toISOString().slice(0,10);run(refresh);
</script></html>
